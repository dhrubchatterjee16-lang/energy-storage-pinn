[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-storage-pinn"
version = "1.0.0"
description = "Physics-Informed Neural Network (PINN) for Battery SEI Growth & Marcus-Hush-Chidsey Kinetics"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Dhrub Chatterjee", email = "dhrubchatterjee16@gmail.com"}
]
keywords = [
    "battery",
    "energy-storage",
    "pinn",
    "marcus-hush-chidsey",
    "sei-growth",
    "conformal-prediction",
    "sciml",
    "electrochemistry"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics"
]
dependencies = [
    "pydantic>=2.0.0",
    "numpy>=1.22.0",
    "scipy>=1.9.0"
]

[project.optional-dependencies]
api = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0"
]
test = [
    "pytest>=7.0.0"
]

[project.scripts]
energy-pinn = "energy_storage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
